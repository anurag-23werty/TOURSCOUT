[project]
name = "tourscout-mcp"
version = "0.1.0"
description = "MCP server that turns Qloo taste data into tour-planning tools for independent musicians"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2"]

[project.scripts]
tourscout-mcp = "tourscout_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tourscout_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Qloo / MusicBrainz APIs (run with TOURSCOUT_LIVE=1)"]
