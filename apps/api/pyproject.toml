[project]
name = "tourscout-api"
version = "0.1.0"
description = "TourScout agent: scoring engine, LangGraph tour planner and API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "tourscout-mcp",
    "langgraph>=1.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
tourscout = "tourscout_api.cli:main"

[tool.uv.sources]
tourscout-mcp = { path = "../../packages/tourscout_mcp", editable = true }

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tourscout_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real Qloo / LLM APIs (run with TOURSCOUT_LIVE=1)"]
