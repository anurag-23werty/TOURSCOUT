[project]
name = "tourscout-api"
version = "0.1.0"
description = "TourScout agent: scoring engine, LangGraph tour planner and API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "tourscout-mcp",
    "langgraph>=1.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
tourscout = "tourscout_api.cli:main"
tourscout-api = "tourscout_api.api.app:main"

[tool.uv.sources]
tourscout-mcp = { path = "../../packages/tourscout_mcp", editable = true }

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tourscout_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real Qloo / LLM APIs (run with TOURSCOUT_LIVE=1)"]
