name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (MCP, agent, API, evals)
    runs-on: ubuntu-latest
    services:
      postgres:  # exercises the Postgres cache and checkpointer, like Neon in production
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: tourscout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:pw@localhost:5432/tourscout
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - name: MCP package
        working-directory: packages/tourscout_mcp
        run: |
          uv sync --extra postgres --python 3.12
          uv run pytest -q
      - name: Agent + API
        working-directory: apps/api
        run: |
          uv sync --python 3.12
          uv run pytest -q
      - name: Eval metrics (offline)
        working-directory: apps/api
        run: uv run pytest -q ../../evals/tests

  web:
    name: Web app (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/api.Dockerfile -t tourscout-api:ci .
